<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程任务评测</title>
<style>
:root{color-scheme:light;--bg:#f4f6f9;--surface:#fff;--ink:#172438;--muted:#556579;--line:#dce4ed;--blue:#2857bb;--blue-bg:#e9efff;--base:#8394af;--good:#087047;--good-bg:#e3f4ea;--bad:#b1343c;--bad-bg:#fbecee;--warn:#835511;--warn-bg:#fff3d9;font:15px/1.6 "Geist","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}a{color:var(--blue);text-underline-offset:3px}a:hover{text-decoration-thickness:2px}button,select{font:inherit;color:inherit}button,select,summary{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
main{width:min(1240px,100% - 48px);margin:auto;padding:36px 0 56px}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-.035em;line-height:1.16}h2{font-size:21px;letter-spacing:-.02em}h3{font-size:15px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}header p{color:var(--muted);margin-top:8px}.mono,.value,.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:13px}.section{margin-top:29px}.heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:11px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:13px}.controls{display:grid;grid-template-columns:1fr 1fr 155px;gap:14px;padding:17px}.controls label{display:grid;gap:5px;font-weight:650;font-size:13px;min-width:0}select{max-width:100%;width:100%;padding:8px 10px;background:var(--surface);border:1px solid #bdc9d8;border-radius:7px;font-weight:400;font-size:14px}.metadata{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.metadata>div{overflow-wrap:anywhere}.metadata .small{display:block}.verdict{margin-top:14px;display:flex;align-items:start;gap:12px;padding:12px 15px}.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:#ebeff5;color:#45556e;font-size:12px;font-weight:650;white-space:nowrap}.tag.improved,.tag.passed{background:var(--good-bg);color:var(--good)}.tag.regressed,.tag.failed{background:var(--bad-bg);color:var(--bad)}.tag.mixed,.tag.unavailable{background:var(--warn-bg);color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:15px}.card{padding:14px 17px}.card h3{color:var(--muted);font-weight:600}.value{font-size:29px;font-weight:730;letter-spacing:-.04em;line-height:1.25;margin:7px 0 5px}.card p{font-size:13px}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric-group{padding:16px}.metric-group:last-child{grid-column:1/-1}.metric-group:last-child .metric-list{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}.metric-row{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:0 8px;padding:10px 0;border-top:1px solid var(--line)}.metric-row:first-child{margin-top:9px}.metric-title{font-size:14px;font-weight:650}.metric-numbers{font-size:13px;grid-column:1/-1;display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px}.mark{width:9px;height:9px;border-radius:2px;display:inline-block;background:var(--base);vertical-align:middle}.mark.after{background:var(--blue)}.metric-bars{grid-column:1/-1;display:grid;gap:4px;margin-top:7px}.bar{background:#eef2f6;height:5px;border-radius:3px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--base);border-radius:3px}.bar.after>span{background:var(--blue)}
.scroll{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th,.table td{padding:10px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:#f9fbfd;font-size:13px;font-weight:650;color:var(--muted)}.table tr:last-child td{border-bottom:0}.table td{font-size:14px}.table .name{min-width:170px}.table .hint{display:block;font-size:12px;color:var(--muted);margin-top:1px}.plain{padding:0;border:0;background:none;color:var(--blue);text-align:left;text-decoration:underline;text-underline-offset:3px}.plain:hover{color:#153578}.detail{margin-top:10px;padding:14px 16px;overflow-wrap:anywhere}.detail>div{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}.detail p{font-size:13px;margin-top:4px}.empty{padding:16px;color:var(--muted)}.history-tools{display:flex;align-items:center;gap:7px}.history-tools select{min-width:125px}.foot{margin-top:22px;color:var(--muted);font-size:13px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}
.trend{padding:12px 16px}.trend-row{display:grid;grid-template-columns:minmax(132px,2fr) 3fr max-content;gap:12px;align-items:center;padding:6px 0;font-size:13px}.trend-row .plain{overflow-wrap:anywhere}.trend-row .bar{height:8px}.trend-row.current .plain{font-weight:700}
@media(max-width:820px){.cards{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1fr}.controls label:last-child{grid-column:1/-1;max-width:200px}.metric-grid{grid-template-columns:1fr}.metric-group:last-child{grid-column:auto}}
@media(max-width:530px){main{width:calc(100% - 26px);padding-top:22px}header,.heading{align-items:flex-start;flex-direction:column;gap:5px}.controls,.metadata,.detail>div,.metric-group:last-child .metric-list{grid-template-columns:1fr}.cards{gap:8px}.card{padding:12px}.value{font-size:24px}}
</style>
</head>
<body>
<main>
  <header><div><h1>行程任务评测</h1><p>按同一案例对比交付、质量与工具开销。</p></div><p id="inventory" class="small"></p></header>
  <div id="empty" class="empty panel" hidden>暂无可读的 live 评测批次。运行 <code>npm run eval:live</code> 或 <code>npm run eval:world</code> 后重新生成。</div>
  <div id="dashboard" hidden>
    <div class="controls panel">
      <label>参照批次<select id="baseline"></select></label>
      <label>待评批次<select id="candidate"></select></label>
      <label>每案取哪次尝试<select id="attempt"><option value="latest">最近一次</option><option value="first">首次</option></select></label>
    </div>
    <div class="metadata" id="metadata"></div>
    <div class="verdict panel" id="verdict" aria-live="polite"></div>
    <div class="cards" id="cards"></div>
    <section class="section" aria-labelledby="metrics-title">
      <div class="heading"><h2 id="metrics-title">指标对比</h2><span class="small muted"><span class="mark"></span> 参照　<span class="mark after"></span> 待评</span></div>
      <div class="metric-grid" id="metrics"></div>
    </section>
    <section class="section" aria-labelledby="trend-title">
      <div class="heading"><h2 id="trend-title">同案例历史趋势</h2><label class="history-tools small">指标<select id="trend-metric"></select></label></div>
      <div class="trend panel" id="trend"></div>
    </section>
    <section class="section" aria-labelledby="cases-title">
      <div class="heading"><h2 id="cases-title">案例变化</h2><span class="muted small" id="case-hint"></span></div>
      <div class="scroll panel"><table class="table"><thead><tr><th>案例</th><th>结果</th><th>有效天数</th><th>必去</th><th>P0 / P1</th><th>工具调用</th><th>判断</th></tr></thead><tbody id="case-rows"></tbody></table></div>
      <div class="panel detail" id="case-detail" hidden></div>
    </section>
    <section class="section" aria-labelledby="history-title">
      <div class="heading"><h2 id="history-title">历史批次</h2><label class="history-tools small">套件<select id="suite-filter"></select></label></div>
      <div class="scroll panel"><table class="table"><thead><tr><th>批次</th><th>提示词 / 数据</th><th>案例</th><th>Strict</th><th>有效天数</th><th>整批估算成本</th><th>报告</th></tr></thead><tbody id="history"></tbody></table></div>
    </section>
    <p class="foot">指标基于本机保存的真实模型批次。历史缺失字段显示 —。固定世界与在线数据分开对比；每个版本只有一次样本时，耗时和费用波动仅供参考。</p>
  </div>
</main>
<script type="application/json" id="evaluation-data"><!--DASHBOARD_DATA--></script>
<script type="module">
/*DASHBOARD_APP*/
</script>
</body>
</html>
